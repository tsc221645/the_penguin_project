name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: production-pages
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Validate tagged commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the release tag object
        run: |
          git fetch --force origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag and package version
        run: npm run validate:release -- "$GITHUB_REF_NAME"

      - name: Require an annotated tag
        run: |
          git cat-file -t "refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = "tag" || {
            echo "Release tags must be annotated tags."
            exit 1
          }

      - name: Verify tagged commit belongs to main
        shell: bash
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Tagged commit $GITHUB_SHA is not contained in origin/main"
            exit 1
          }

      - name: Run quality gate
        run: npm run check

      - name: Build tagged release
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_APP_VERSION: ${{ github.ref_name }}

      - name: Verify production output
        run: npm run test:smoke

      - name: Preserve release artifact
        run: mv dist dist-release

      - name: Build E2E test bundle
        run: npm run build
        env:
          VITE_BASE: /

      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Restore release artifact
        if: always()
        run: |
          rm -rf dist
          mv dist-release dist

      - name: Verify Pages files
        run: test -s dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: dist

  deploy:
    name: Deploy tagged release
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

  create-release:
    name: Create GitHub Release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release if it does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "Penguin Project $TAG"
          fi
